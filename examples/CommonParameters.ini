; ============================================================================
; CommonParameters.ini — GC3D 相机默认配置
; ============================================================================

;不分设备类型的通用参数
[COMMON]
;设置SDK内部图像缓存节点个数，大于等于1，若不设置SDK内部默认为1
ImageNodeNum=1

;网口相机相关参数
[GIGE]
;设置GVCP命令超时时间，默认500ms，范围：0-10000ms
GvcpTimeout=500

;U口相机相关参数
[U3V]
;设置U3V的传输包大小，Byte，默认为1M，rang：>=0x400
TransferSize=1048576

;CameraLink相机相关参数
[CAML]

;图像处理相关的参数
[IMG_PROCESSING]
;设置插值算法类型，0-快速 1-均衡 2-最优 3-最优+（默认为最优）
BayerCvtQuality=2
;设置插值算法处理线程个数，0-自适应 其他-具体线程个数(1,2,3,...)（默认线程个数为4）
BayerCvtThreadNum=4

; ============================================================================
; GC3D 相机参数 
;
; 格式: key = value
; 支持的数据类型: int / float / double / bool (true/false) / string
; ============================================================================

; ----- 曝光参数 -----
exposureNum = 1                ; 曝光次数 1~3
exposureTime = 800             ; 第1次曝光 单位: us (100 ~ maxExposureTime)
exposureTime2 = 2000           ; 第2次曝光 (多曝光HDR模式使用)
exposureTime3 = 3000           ; 第3次曝光 (多曝光HDR模式使用)
gain = 0.0                     ; 增益 (0.0 ~ 20.0)

; ----- 2D 拍摄参数 -----
expTime2D = 1000               ; 2D 模式曝光时间 (us)
gain2D = 5.0                   ; 2D 模式增益

; ----- 重建阈值 -----
gminThreshold = 30             ; 最小亮度阈值 (0~255)
gmaxThreshold = 220            ; 最大亮度阈值 (0~255)

; ----- 降噪参数 -----
gfmr = 3                       ; 去噪半径: 1=3x3, 2=5x5, 3=7x7
gdenoiseIndex1 = 20.0          ; fmr半径内最少有效点数
gdenoiseIndex2 = 1.0           ; 全局Z方差阈值
gdenoiseIndex3 = 2.0           ; 局部高度差阈值

; ----- 平滑参数 -----
gsmoothParam = 0               ; 平滑强度 (0=无平滑, >0=平滑)
m_useSmooth = false            ; 是否启用平滑

; ----- 高度范围 -----
gminHeight = -1000.0           ; 最小高度 (mm)
gmaxHeight = 1000.0            ; 最大高度 (mm)

; ----- 数据输出 -----
gNeedGridData = false          ; 是否生成规则网格化数据
gUseBasePlane = false          ; 是否使用基准面
gErodeSize = 0                 ; 数据腐蚀大小 (0,1,3,5,7...)
gridSearchRange = 30           ; 网格查找范围 (0~100)

; ----- 网络通信 -----
heartBeatTimeout = 3000        ; 网口相机心跳超时 (ms)
